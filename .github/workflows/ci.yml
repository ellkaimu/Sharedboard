name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify byte-compilation
        run: python -m compileall -q shareboard/ tests/

      - name: Run tests
        run: pytest -q --color=yes

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            dh-python \
            python3-all \
            python3-setuptools \
            python3-wheel \
            python3-pybuild-plugin-pyproject \
            devscripts \
            build-essential
          # pycrdt isn't in Debian bookworm repos; install from PyPI for the
          # postinst smoke test only.
          pip3 install --break-system-packages pycrdt

      - name: Build
        run: ./build_deb.sh

      - name: Inspect .deb
        run: |
          cd ..
          ls -la *.deb
          dpkg-deb -I shareboard_*.deb | head -30
          dpkg-deb -c shareboard_*.deb | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareboard-deb
          path: ../shareboard_*.deb
          if-no-files-found: error
