name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify byte-compilation
        run: python -m compileall -q shareboard/ tests/

      - name: Run tests
        run: pytest -q --color=yes

  build-deb:
    name: Build .deb (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip

      - name: Build .deb
        env:
          SHAREBOARD_DEB_MODE: manual
        run: ./build_deb.sh

      - name: Stage and inspect .deb
        run: |
          set -euxo pipefail
          cp ../shareboard_*.deb .
          DEB="$(ls -1 shareboard_*.deb | head -n1)"
          ls -la "$DEB"
          dpkg-deb -I "$DEB" | head -40
          echo "packaged files: $(dpkg-deb -c "$DEB" | wc -l)"
          dpkg-deb -c "$DEB" \
            | grep -E '(usr/bin|systemd|applications|site-packages/(flask|pycrdt))/' \
            | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareboard-deb
          path: shareboard_*.deb
          if-no-files-found: error

      - name: Smoke test (install & run on this jammy runner)
        run: |
          set -euxo pipefail
          sudo apt-get install -y ./shareboard_*.deb

          # The postinst enables + starts the systemd service on port 8888.
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8888/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8888/ >/dev/null
          # socket.io engine.io handshake (exercises flask-socketio stack)
          curl -fsS "http://127.0.0.1:8888/socket.io/?EIO=4&transport=polling" \
            | grep -q '"sid"'
          echo "systemd service OK"

          # Also verify a direct (non-systemd) launch on another port.
          SHAREBOARD_PORT=8899 \
          SHAREBOARD_DATA_DIR="$RUNNER_TEMP/shareboard-smoke" \
            shareboard &
          APP_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8899/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8899/ >/dev/null
          echo "direct launch OK"

          kill "$APP_PID" || true
          sudo apt-get remove -y shareboard
