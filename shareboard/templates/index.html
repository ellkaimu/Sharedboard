{% extends "base.html" %}
{% block title %}ShareBoard — your shared boards{% endblock %}
{% block body %}
<header class="topbar">
  <h1 class="brand">ShareBoard</h1>
  <span class="tagline">Realtime collaborative editor</span>
</header>

<main class="container">
  <section class="card">
    <div class="row">
      <h2>Boards</h2>
      <button id="new-board-btn" class="primary">+ New board</button>
    </div>
    <ul id="board-list" class="board-list">
      <li class="empty">Loading…</li>
    </ul>
  </section>
</main>

<template id="board-item-template">
  <li class="board-item">
    <a class="board-link">
      <div class="board-name"></div>
      <div class="board-meta"></div>
    </a>
    <button class="delete" title="Delete board">×</button>
  </li>
</template>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const listEl = document.getElementById("board-list");
  const newBtn = document.getElementById("new-board-btn");
  const tpl = document.getElementById("board-item-template");

  function timeAgo(ts) {
    const diff = (Date.now() / 1000 - ts);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[c]));
  }

  async function load() {
    const r = await fetch("/api/boards");
    const boards = await r.json();
    listEl.innerHTML = "";
    if (boards.length === 0) {
      listEl.innerHTML = '<li class="empty">No boards yet. Create one above.</li>';
      return;
    }
    for (const b of boards) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      node.querySelector(".board-link").href = "/b/" + b.id;
      node.querySelector(".board-name").textContent = b.name;
      node.querySelector(".board-meta").textContent =
        `${b.has_snapshot ? "saved" : "empty"} · updated ${timeAgo(b.updated_at)}`;
      node.querySelector(".delete").addEventListener("click", async (ev) => {
        ev.preventDefault();
        if (!confirm(`Delete "${b.name}"? This cannot be undone.`)) return;
        const r2 = await fetch("/api/boards/" + b.id, { method: "DELETE" });
        if (r2.ok) load();
      });
      listEl.appendChild(node);
    }
  }

  newBtn.addEventListener("click", async () => {
    const name = prompt("Board name?", "Untitled");
    if (!name) return;
    newBtn.disabled = true;
    try {
      const r = await fetch("/api/boards", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.trim() || "Untitled" }),
      });
      const b = await r.json();
      window.location.href = "/b/" + b.id;
    } finally {
      newBtn.disabled = false;
    }
  });

  load();
</script>
{% endblock %}
